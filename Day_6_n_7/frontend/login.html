<!DOCTYPE html>
<html>

<head>
    <title>Login - TrendScope AI</title>
    <link rel="stylesheet" href="styles/auth.css">
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="loginUser()">
            Login
        </button>

        <p id="message"></p>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
