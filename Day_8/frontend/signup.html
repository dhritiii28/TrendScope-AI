<!DOCTYPE html>
<html>

<head>
    <title>Signup - TrendScope AI</title>
    <link rel="stylesheet" href="styles/auth.css">
</head>

<body>

    <div class="container">

        <h1>Sign up</h1>

        <input
            type="number"
            id="id"
            placeholder="User ID"
        >

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="registerUser()">
            Register
        </button>

        <p id="message"></p>

    </div>

    <script src="js/signup.js"></script>

</body>
</html>
